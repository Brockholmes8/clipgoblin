<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#1a0638"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#9ef01a"/>
      <stop offset="1" stop-color="#3a9a0c"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff59d"/>
      <stop offset="1" stop-color="#ffc400"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- glow rays -->
  <g opacity="0.18" fill="#c77dff">
    <path d="M512 470 L120 60 L260 40 Z"/><path d="M512 470 L900 60 L760 40 Z"/>
    <path d="M512 470 L40 420 L60 300 Z"/><path d="M512 470 L984 420 L964 300 Z"/>
  </g>
  <g stroke="#0b1a02" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <path d="M300 470 L70 330 L140 560 Q220 600 320 580 Z" fill="url(#skin)"/>
    <path d="M724 470 L954 330 L884 560 Q804 600 704 580 Z" fill="url(#skin)"/>
    <path d="M270 500 L150 420 L185 535 Z" fill="#2d7a08" stroke-width="8"/>
    <path d="M754 500 L874 420 L839 535 Z" fill="#2d7a08" stroke-width="8"/>
    <!-- head -->
    <path d="M512 210 C700 210 770 330 770 500 C770 700 650 830 512 830 C374 830 254 700 254 500 C254 330 324 210 512 210 Z" fill="url(#skin)"/>
    <!-- headset band -->
    <path d="M250 470 C250 170 774 170 774 470" fill="none" stroke="#111" stroke-width="44"/>
    <path d="M250 470 C250 170 774 170 774 470" fill="none" stroke="#ff2e88" stroke-width="18"/>
    <!-- ear cups -->
    <rect x="205" y="420" width="90" height="170" rx="40" fill="#ff2e88"/>
    <rect x="729" y="420" width="90" height="170" rx="40" fill="#ff2e88"/>
    <!-- mic -->
    <path d="M250 580 Q270 700 345 715" fill="none" stroke="#111" stroke-width="20"/>
    <circle cx="355" cy="715" r="26" fill="#111"/>
    <!-- brows -->
    <path d="M340 420 L470 465" stroke-width="30"/>
    <path d="M684 420 L554 465" stroke-width="30"/>
    <!-- eyes -->
    <ellipse cx="415" cy="520" rx="62" ry="52" fill="url(#eye)"/>
    <ellipse cx="609" cy="520" rx="62" ry="52" fill="url(#eye)"/>
    <ellipse cx="425" cy="525" rx="14" ry="38" fill="#0b1a02" stroke="none"/>
    <ellipse cx="599" cy="525" rx="14" ry="38" fill="#0b1a02" stroke="none"/>
    <!-- nose -->
    <path d="M500 560 Q512 620 540 610" fill="none" stroke-width="12"/>
    <!-- grin -->
    <path d="M385 640 Q512 800 650 635 Q512 690 385 640 Z" fill="#3b0a2a"/>
    <path d="M440 712 Q512 745 585 712 Q512 770 440 712 Z" fill="#ff5c8a" stroke="none"/>
    <path d="M425 658 L445 700 L468 668 Z M565 668 L588 700 L608 655 Z" fill="#fff" stroke-width="6"/>
  </g>
  <!-- scissors badge -->
  <g transform="translate(760 760) rotate(-20)">
    <circle r="120" fill="#ffd60a" stroke="#0b1a02" stroke-width="16"/>
    <g stroke="#0b1a02" stroke-width="16" fill="none" stroke-linecap="round">
      <circle cx="-45" cy="45" r="28"/><circle cx="45" cy="45" r="28"/>
      <path d="M-28 22 L45 -75"/><path d="M28 22 L-45 -75"/>
    </g>
  </g>
</svg>
